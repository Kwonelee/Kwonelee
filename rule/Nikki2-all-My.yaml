rule-anchor:
  P: &P {type: http, interval: 604800, health-check: {enable: false, url: 'https://www.gstatic.com/generate_204', interval: 0}, exclude-filter: "官网|剩余|流量|套餐|订阅|直连|到期时间|Expire Date|Traffic|ExpireDate", proxy: ➡️ 直连}
  # 节点选择
  G1: &G1 {type: select, proxies: [默认代理, CF-手动, 🇭🇰 香港-自动, 🇯🇵 日本-自动, 🇨🇳 台湾-自动, 🇸🇬 狮城-自动, 🇲🇾 马来-自动, 🇮🇳 印度-自动, 其他-自动, 其他-手动, ➡️ 直连]}
  S1: &S1 {type: select, proxies: [CF-手动, 🇭🇰 香港-自动, 🇯🇵 日本-自动, 🇨🇳 台湾-自动, 🇸🇬 狮城-自动, 🇲🇾 马来-自动, 🇮🇳 印度-自动, 其他-自动, 其他-手动, ➡️ 直连]}
  # 节点筛选
  HK: &HK "(?=.*(港|HK|H​K|(?i)Hong))^((?!(日|台|新|马|印|美|韩)).)*$"
  JP: &JP "(?=.*(日|JP|J​P|(?i)Japan))^((?!(港|台|新|马|印|美|韩)).)*$"
  TW: &TW "(?=.*(台|TW|T​W|(?i)Taiwan))^((?!(港|日|新|马|印|美|韩)).)*$"
  SG: &SG "(?=.*(新加坡|坡|狮城|SG|S​G|Singapore))^((?!(港|日|台|马|印|美|韩)).)*$"
  MY: &MY "(?=.*(马来西亚|MY|M​Y|(?i)Malaysia))^((?!(港|日|台|新|印|美|韩)).)*$"
  IN: &IN "(?=.*(印度|IN|I​N|(?i)India))^((?!(港|日|台|新|马|美|韩)).)*$"
  Exclude: &Exclude "^((?!(本地|CF|官网|剩余|流量|套餐|订阅|到期时间|直连|GB|Expire Date|Traffic|ExpireDate)).)*$"
  # 策略组
  SD: &SD {type: select, include-all: true, empty-fallback: REJECT}
  URL: &URL {type: url-test, include-all: true, empty-fallback: REJECT, tolerance: 50, interval: 300, lazy: true, url: 'https://www.gstatic.com/generate_204'}
  # ICON
  Auto: &Auto "https://testingcf.jsdelivr.net/gh/s0lnce/mofish-icon@main/mihomo/pure/corner/failover.png"
  All: &All "https://testingcf.jsdelivr.net/gh/s0lnce/mofish-icon@main/mihomo/pure/corner/all.png"
  # 规则集
  base-ruleset-dn: &base-ruleset-dn { type: http, behavior: domain, proxy: DIRECT, format: mrs, interval: 86400 }
  base-ruleset-ip: &base-ruleset-ip { type: http, behavior: ipcidr, proxy: DIRECT, format: mrs, interval: 86400 }

proxy-providers:
  CF优选: {<<: *P, url: "XXX", override: {additional-prefix: '本地 '}}
  #Mia公益: {<<: *P, url: "XXX", override: {additional-prefix: '公益 '}}

proxies:
  - {name: ➡️ 直连, type: direct, udp: true}

mode: rule
mixed-port: 7890
allow-lan: true
skip-auth-prefixes: ['127.0.0.0/8', '192.168.0.0/16']
log-level: warning
external-controller: 0.0.0.0:9090
secret: "123456"
bind-address: '*'
external-ui-url: https://gh-proxy.com/github.com/Zephyruso/zashboard/releases/latest/download/dist.zip
external-ui-name: zashboard
external-ui: ui
ipv6: true
tcp-concurrent: true
unified-delay: true
find-process-mode: strict
keep-alive-interval: 60
keep-alive-idle: 60

tun:
  enable: true
  auto-route: true
  strict-route: true
  auto-redirect: true
  auto-detect-interface: true
  disable-icmp-forwarding: true
  dns-hijack: ['any:53', 'tcp://any:53']
  stack: mips

sniffer:
  enable: true
  override-destination: false
  force-dns-mapping: false
  parse-pure-ip: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

dns:
  enable: true
  ipv6: true
  listen: 0.0.0.0:1053
  cache-algorithm: arc
  use-hosts: true
  respect-rules: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-range6: 2001:2::1/48
  fake-ip-filter:  ['rule-set:private', 'rule-set:fakeip-filter', 'rule-set:cn']
  default-nameserver: ['223.5.5.5#DIRECT', '119.29.29.29#DIRECT']
  proxy-server-nameserver: ['https://dns.alidns.com/dns-query#DIRECT', 'https://doh.pub/dns-query#DIRECT']
  nameserver: ['https://dns.google/dns-query#DNS&ecs=223.5.5.0/24', 'https://cloudflare-dns.com/dns-query#DNS&ecs=223.5.5.0/24']
  nameserver-policy:
    'rule-set:private': system
    'rule-set:cn': ['223.5.5.5#DIRECT', '119.29.29.29#DIRECT']
  direct-nameserver: ['223.6.6.6#DIRECT', '119.29.29.29#DIRECT']
  direct-nameserver-follow-policy: true

hosts:
  'dns.alidns.com': ['223.5.5.5', '223.6.6.6']
  'doh.pub': ['1.12.12.12', '120.53.53.53']
  'dns.google': ['8.8.8.8', '8.8.4.4']
  'cloudflare-dns.com': ['1.1.1.1', '1.0.0.1']
  'doh.opendns.com': ['208.67.222.222', '208.67.220.220']
  'services.googleapis.cn': 'services.googleapis.com'

profile: { store-selected: true, store-fake-ip: true }

ntp:
  enable: true
  write-to-system: true

proxy-groups:
  - {name: 默认代理, <<: *S1, icon: "https://testingcf.jsdelivr.net/gh/s0lnce/mofish-icon@main/mihomo/pure/corner/select.png"}
  - {name: AI, <<: *G1, icon: "https://testingcf.jsdelivr.net/gh/s0lnce/mofish-icon@main/mihomo/pure/corner/ai.png"}
  - {name: YouTube, <<: *G1, icon: "https://testingcf.jsdelivr.net/gh/s0lnce/mofish-icon@main/mihomo/pure/corner/youtube.png"}
  - {name: Google, <<: *G1, icon: "https://testingcf.jsdelivr.net/gh/s0lnce/mofish-icon@main/mihomo/pure/corner/google.png"}
  - {name: GitHub, <<: *G1, icon: "https://testingcf.jsdelivr.net/gh/s0lnce/mofish-icon@main/mihomo/pure/corner/github.png"}
  - {name: Telegram, <<: *G1, icon: "https://testingcf.jsdelivr.net/gh/s0lnce/mofish-icon@main/mihomo/pure/corner/telegram.png"}
  - {name: TikTok, <<: *G1, icon: "https://testingcf.jsdelivr.net/gh/s0lnce/mofish-icon@main/mihomo/pure/corner/douyin.png"}
  - {name: NETFLIX, <<: *G1, icon: "https://testingcf.jsdelivr.net/gh/s0lnce/mofish-icon@main/mihomo/pure/corner/netflix.png"}
  - {name: Microsoft, <<: *G1, icon: "https://testingcf.jsdelivr.net/gh/s0lnce/mofish-icon@main/mihomo/pure/corner/microsoft.png"}
  - {name: Apple, <<: *G1, icon: "https://testingcf.jsdelivr.net/gh/s0lnce/mofish-icon@main/mihomo/pure/corner/apple.png"}
  - {name: 漏网之鱼, <<: *G1, icon: "https://testingcf.jsdelivr.net/gh/s0lnce/mofish-icon@main/mihomo/pure/corner/final.png"}
  - {name: CF-手动, <<: *SD, filter: "(?=.*(本地|CF)).*$", icon: "https://testingcf.jsdelivr.net/gh/LancelotRar/policy-icon-set@main/IconSet/Color/Clubhouse.png"}
  - {name: 其他-手动, <<: *SD, filter: *Exclude, icon: *All}
  - {name: 其他-自动, <<: *URL, filter: *Exclude, icon: *Auto}
  - {name: 🇭🇰 香港-自动, <<: *URL, filter: *HK}
  - {name: 🇯🇵 日本-自动, <<: *URL, filter: *JP}
  - {name: 🇨🇳 台湾-自动, <<: *URL, filter: *TW}
  - {name: 🇸🇬 狮城-自动, <<: *URL, filter: *SG}
  - {name: 🇲🇾 马来-自动, <<: *URL, filter: *MY}
  - {name: 🇮🇳 印度-自动, <<: *URL, filter: *IN}

rules:
  - AND,((RULE-SET,cn!_domain),(DST-PORT,443),(NETWORK,UDP)),REJECT
  - RULE-SET,private_ip,➡️ 直连,no-resolve
  - RULE-SET,private_domain,➡️ 直连
  - RULE-SET,ai_domain,AI
  - RULE-SET,youtube_domain,YouTube
  - RULE-SET,google_domain,Google
  - RULE-SET,github_domain,GitHub
  - RULE-SET,microsoftcn_domain,➡️ 直连
  - RULE-SET,microsoft_domain,Microsoft
  - RULE-SET,applecn_domain,➡️ 直连
  - RULE-SET,apple_domain,Apple
  - RULE-SET,telegram_domain,Telegram
  - RULE-SET,tiktok_domain,TikTok
  - RULE-SET,netflix_domain,NETFLIX
  - RULE-SET,cn!_domain,默认代理
  - RULE-SET,google_ip,Google
  - RULE-SET,apple_ip,Apple
  - RULE-SET,telegram_ip,Telegram
  - RULE-SET,netflix_ip,NETFLIX
  - RULE-SET,cn_ip,➡️ 直连
  - MATCH,漏网之鱼

