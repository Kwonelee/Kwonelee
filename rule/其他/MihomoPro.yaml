# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 🛠️  第一部分：YAML 锚点配置 (Anchors & Templates)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ─── 1. 代理提供者模板 (Subscription Provider Template) ────────────────────────
BaseProvider: &BaseProvider
  type: http
  interval: 86400                           # 自动更新间隔：24小时 (秒)
  proxy: DIRECT                             # 更新订阅时使用的代理
  health-check:
    enable: true
    url: 'https://www.google.com/generate_204'
    interval: 300                           # 节点健康检查间隔：5分钟
  # 正则过滤：自动剔除垃圾/通知/流量等信息节点
  filter: '^(?!.*(群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author))'

# ─── 2. 策略组基础模板 (Policy Group Templates) ────────────────────────────────
BaseFB: &BaseFB { type: fallback,     interval: 200, lazy: true, empty-fallback: REJECT, url: 'https://www.google.com/generate_204' }                               # 自动故障转移
BaseCH: &BaseCH { type: load-balance, interval: 200, lazy: true, empty-fallback: REJECT, url: 'https://www.google.com/generate_204', strategy: consistent-hashing, hidden: true } # 负载均衡-一致性哈希
BaseCR: &BaseCR { type: load-balance, interval: 200, lazy: true, empty-fallback: REJECT, url: 'https://www.google.com/generate_204', strategy: round-robin,        hidden: true } # 负载均衡-轮询模式
BaseUT: &BaseUT { type: url-test,     interval: 200, lazy: true, empty-fallback: REJECT, url: 'https://www.google.com/generate_204', hidden: true }                       # 自动测速选择

# ─── 3. 地区正则筛选 (Location RegEx Filters) ──────────────────────────────────
FilterHK: &FilterHK '^(?=.*(?i)(港|🇭🇰|HK|Hong|HKG))(?!.*(排除1|排除2|5x)).*$'
FilterSG: &FilterSG '^(?=.*(?i)(坡|🇸🇬|SG|Sing|SIN|XSP))(?!.*(排除1|排除2|5x)).*$'
FilterJP: &FilterJP '^(?=.*(?i)(日|🇯🇵|JP|Japan|NRT|HND|KIX|CTS|FUK))(?!.*(排除1|排除2|5x)).*$'
FilterKR: &FilterKR '^(?=.*(?i)(韩|🇰🇷|韓|首尔|南朝鲜|KR|KOR|Korea|South))(?!.*(排除1|排除2|5x)).*$'
FilterUS: &FilterUS '^(?=.*(?i)(美|🇺🇸|US|USA|SJC|JFK|LAX|ORD|ATL|DFW|SFO|MIA|SEA|IAD))(?!.*(排除1|排除2|5x)).*$'
FilterTW: &FilterTW '^(?=.*(?i)(台|🇼🇸|🇹🇼|TW|tai|TPE|TSA|KHH))(?!.*(排除1|排除2|5x)).*$'
FilterEU: &FilterEU '^(?=.*(?i)(奥|比|保|克罗地亚|塞|捷|丹|爱沙|芬|法|德|希|匈|爱尔|意|拉|立|卢|马其它|荷|波|葡|罗|斯洛伐|斯洛文|西|瑞|英|🇧🇪|🇨🇿|🇩🇰|🇫🇮|🇫🇷|🇩🇪|🇮🇪|🇮🇹|🇱🇹|🇱🇺|🇳🇱|🇵🇱|🇸🇪|🇬🇧|CDG|FRA|AMS|MAD|BCN|FCO|MUC|BRU))(?!.*(排除1|排除2|5x)).*$'
FilterOT: &FilterOT '^(?!.*(DIRECT|直接连接|美|港|坡|台|新|日|韩|奥|比|保|克罗地亚|塞|捷|丹|爱沙|芬|法|德|希|匈|爱尔|意|拉|立|卢|马其它|荷|波|葡|罗|斯洛伐|斯洛文|西|瑞|英|🇭🇰|🇼🇸|🇹🇼|🇸🇬|🇯🇵|🇰🇷|🇺🇸|🇬🇧|🇦🇹|🇧🇪|🇨🇿|🇩🇰|🇫🇮|🇫🇷|🇩🇪|🇮🇪|🇮🇹|🇱🇹|🇱🇺|🇳🇱|🇵🇱|🇸🇪|HK|TW|SG|JP|KR|US|GB|CDG|FRA|AMS|MAD|BCN|FCO|MUC|BRU|HKG|TPE|TSA|KHH|SIN|XSP|NRT|HND|KIX|CTS|FUK|JFK|LAX|ORD|ATL|DFW|SFO|MIA|SEA|IAD|LHR|LGW))'
FilterAL: &FilterAL '^(?!.*(DIRECT|直接连接|群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author))'

# ─── 4. 节点优先级策略 (Proxy Priority Templates) ─────────────────────────────
SelectFB: &SelectFB { type: select, proxies: [香港策略, 狮城策略, 日本策略, 韩国策略, 美国策略, 台湾策略, 欧盟策略, 冷门自选, 全球手动, 直接连接] }
SelectPY: &SelectPY { type: select, proxies: [默认代理, 香港策略, 狮城策略, 日本策略, 韩国策略, 美国策略, 台湾策略, 欧盟策略, 冷门自选, 全球手动, 直接连接] }
SelectDC: &SelectDC { type: select, proxies: [直接连接, 默认代理, 香港策略, 狮城策略, 日本策略, 韩国策略, 美国策略, 台湾策略, 欧盟策略, 冷门自选, 全球手动] }
SelectHK: &SelectHK { type: select, proxies: [香港策略, 默认代理, 狮城策略, 日本策略, 韩国策略, 美国策略, 台湾策略, 欧盟策略, 冷门自选, 全球手动, 直接连接] }
SelectSG: &SelectSG { type: select, proxies: [狮城策略, 默认代理, 香港策略, 日本策略, 韩国策略, 美国策略, 台湾策略, 欧盟策略, 冷门自选, 全球手动, 直接连接] }
SelectUS: &SelectUS { type: select, proxies: [美国策略, 默认代理, 香港策略, 狮城策略, 日本策略, 韩国策略, 台湾策略, 欧盟策略, 冷门自选, 全球手动, 直接连接] }


# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 📡  第二部分：订阅提供者 (Proxy Providers)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

proxy-providers:
  # 优质主用订阅
  优质服务商:
    <<: *BaseProvider
    url: '优质订阅源地址'
    override:
      additional-prefix: '[优] '            # 统一加入节点前缀

  # 备用补充订阅
  备用服务商:
    <<: *BaseProvider
    url: '备用订阅源地址'
    override:
      additional-prefix: '[备] '            # 统一加入节点前缀


# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ⚙️  第三部分：核心与系统参数 (Core Settings)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ─── 1. 网络与运行模式 ────────────────────────────────────────────────────────
mode: rule                                  # 路由模式 (rule/global/direct)
port: 7890                                  # HTTP(S) 代理端口
socks-port: 7891                            # SOCKS5 代理端口
redir-port: 7892                            # 透明代理端口 (Linux/macOS)
mixed-port: 7893                            # 混合代理端口 (HTTP & SOCKS5)
tproxy-port: 7895                           # TProxy 端口 (Linux)
ipv6: true                                  # 开启 IPv6 支持
allow-lan: false                            # 允许局域网设备连接
bind-address: '*'                           # 监听网卡接口
unified-delay: true                         # 统一延迟计算 (消除 TCP 握手损耗)
tcp-concurrent: true                        # TCP 并发连接 (自动匹配最佳节点)
log-level: warning                          # 日志级别 (info/warning/error/silent)
find-process-mode: 'always'                 # 进程匹配模式 (always/strict/off)
keep-alive-interval: 15                     # 心跳检测间隔 (秒)
keep-alive-idle: 600                        # TCP 空闲超时 (秒)

# ─── 2. API 与身份鉴权 ────────────────────────────────────────────────────────
authentication:
  - mihomo:yyds666                          # 连接鉴权账号密码
skip-auth-prefixes:
  - 127.0.0.1/8                             # 免认证本机 IPv4 段
  - ::1/128                                 # 免认证本机 IPv6 段

# ─── 3. 实验性参数 ───────────────────────────────────────────────────────────
experimental:
  quic-go-disable-gso: true                 # 禁用 QUIC GSO 提高兼容性

# ─── 4. 控制面板与 Web API ────────────────────────────────────────────────────
external-controller: 127.0.0.1:9090        # RESTful API 监听地址
secret: yyds666                            # API 密钥
external-ui: ui                            # 控制面板文件目录
external-ui-name: zashboard                # Dashboard 界面类型
external-ui-url: https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip

# ─── 5. 状态持久化存储 ────────────────────────────────────────────────────────
profile:
  store-selected: true                      # 记住上次选中的策略节点
  store-fake-ip: true                       # 持久化 Fake-IP 缓存映射

# ─── 6. 流量嗅探 (Sniffer) ────────────────────────────────────────────────────
sniffer:
  enable: true                              # 开启域名嗅探 (解决 TLS/QUIC 连接重定向)
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

# ─── 7. TUN 虚拟网卡设置 ──────────────────────────────────────────────────────
tun:
  enable: false                             # TUN 模式开关
  stack: mixed                              # 协议栈 (system/gvisor/mixed)
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  auto-route: true                          # 自动配置路由表
  auto-redirect: true                       # 自动转发系统流量
  auto-detect-interface: true              # 自动检测网络出口

# ─── 8. 高级 DNS 解析器 ───────────────────────────────────────────────────────
dns:
  enable: true                              # 内置 DNS 引擎开关
  ipv6: true                                # 启用 DNS IPv6 解析
  enhanced-mode: fake-ip                    # 解析增强模式 (fake-ip/redir-host)
  fake-ip-range: 198.18.0.1/16              # Fake-IP 网段范围
  
  # 上游直连基础 DNS
  default-nameserver:
    - 119.29.29.29                          # DNSPod
    - 180.184.1.1                           # ByteDance DNS
    - 223.5.5.5                             # AliDNS
    
  # 主要 DoH 解析服务器
  nameserver:
    - https://dns.alidns.com/dns-query     # Ali DoH
    - https://doh.pub/dns-query             # DNSPod DoH
    
  # 直连与响应绕过 Fake-IP 列表
  fake-ip-filter:
    - rule-set:Direct
    - rule-set:Private
    - rule-set:China
    - +.miwifi.com
    - +.docker.io
    - +.market.xiaomi.com
    - +.push.apple.com


