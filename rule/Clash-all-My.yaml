# ========================
# 锚点 start
# ========================
# 策略组
pr: &pr {type: select, proxies: [默认节点,CF-手动,其他-自动,🇸🇬 新加坡-自动,🇯🇵 日本-自动,🇭🇰 香港-自动,🇨🇳 台湾-自动,🇲🇾 马来西亚-自动,🗺 其他国家-自动,其他-手动,➡️ 直连,🚫 拒绝]}
pr_ut: &pr_ut {type: url-test, include-all: true, empty-fallback: "🚫 拒绝", url: "https://www.gstatic.com/generate_204"}
pr_ad: &pr_ad {type: select, proxies: [🚫 拒绝,➡️ 直连,默认节点]}
pr_gn: &pr_gn {type: select, proxies: [➡️ 直连,默认节点]}
#订阅更新与延迟测试
p: &p {type: http, interval: 604800, proxy: ➡️ 直连, health-check: {enable: true, url: "https://www.gstatic.com/generate_204", interval: 86400}}

# url 里填写自己的订阅,名称不能重复
proxy-providers:
  CF优选:
    <<: *p
    url: "XXX"
    override:
      additional-prefix: '本地 '

# 节点信息
proxies:
  - {name: ➡️ 直连, type: direct, udp: true}
  - {name: 🚫 拒绝, type: reject, udp: true}

# ========================
# 网络与运行模式
# ========================
mode: rule                                  # 路由模式 (rule/global/direct)
port: 7890                                  # HTTP(S) 代理端口
socks-port: 7891                            # SOCKS5 代理端口
redir-port: 7892                            # 透明代理端口 (Linux/macOS)
mixed-port: 7893                            # 混合代理端口 (HTTP & SOCKS5)
tproxy-port: 7895                           # TProxy 端口 (Linux)
ipv6: true                                  # 开启 IPv6 支持
allow-lan: true                             # 允许局域网设备连接
bind-address: '*'                           # 监听网卡接口
unified-delay: true                         # 统一延迟计算 (消除 TCP 握手损耗)
tcp-concurrent: true                        # TCP 并发连接 (自动匹配最佳节点)
log-level: warning                          # 日志级别 (info/warning/error/silent)
find-process-mode: 'always'                 # 进程匹配模式 (always/strict/off)
keep-alive-interval: 15                     # 心跳检测间隔 (秒)
keep-alive-idle: 600                        # TCP 空闲超时 (秒)
# 实验性参数
experimental:
  quic-go-disable-gso: true                 # 禁用 QUIC GSO 提高兼容性

# ========================
# 控制面板
# ========================
external-controller: 0.0.0.0:9090
external-ui: /usr/share/openclash/ui
external-ui-name: zashboard
external-ui-url: https://gh-proxy.com/github.com/Zephyruso/zashboard/archive/refs/heads/dist.zip
secret: "123456"

# ========================
# 状态持久化存储
# ========================
profile:
  store-selected: true                      # 记住上次选中的策略节点
  store-fake-ip: true                       # 持久化 Fake-IP 缓存映射

# ========================
# 流量嗅探
# ========================
sniffer:
  enable: true                              # 开启域名嗅探 (解决 TLS/QUIC 连接重定向)
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

# ========================
# DNS 设置
# ========================
dns:
  enable: true                              # 内置 DNS 引擎开关
  ipv6: true                                # 启用 DNS IPv6 解析
  enhanced-mode: fake-ip                    # 解析增强模式 (fake-ip/redir-host)
  fake-ip-range: 198.18.0.1/16              # Fake-IP 网段范围
  # 上游直连基础 DNS
  default-nameserver:
    - 119.29.29.29                          # DNSPod
    - 180.184.1.1                           # ByteDance DNS
    - 223.5.5.5                             # AliDNS
  # 主要 DoH 解析服务器
  nameserver:
    - https://dns.alidns.com/dns-query      # Ali DoH
    - https://doh.pub/dns-query             # DNSPod DoH
  # 直连与响应绕过 Fake-IP 列表
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - +.lan
    - +.local
    - geosite:cn
    - +.miwifi.com
    - +.docker.io
    - +.market.xiaomi.com
    - +.push.apple.com

# ========================
# TUN 模块
# ========================
tun:
  enable: false                             # TUN 模式开关
  stack: mixed                              # 协议栈 (system/gvisor/mixed)
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  auto-route: true                          # 自动配置路由表
  auto-redirect: true                       # 自动转发系统流量
  auto-detect-interface: true               # 自动检测网络出口

# ========================
# 策略组定义
# ========================
proxy-groups:
  - {name: 默认节点, type: select, proxies: [CF-手动,其他-自动,🇸🇬 新加坡-自动,🇯🇵 日本-自动,🇭🇰 香港-自动,🇨🇳 台湾-自动,🇲🇾 马来西亚-自动,🗺 其他国家-自动,其他-手动,➡️ 直连,🚫 拒绝], icon: https://testingcf.jsdelivr.net/gh/LancelotRar/policy-icon-set@main/IconSet/Color/Rocket.png}
  - {name: AD, <<: *pr_ad, icon: https://testingcf.jsdelivr.net/gh/LancelotRar/policy-icon-set@main/IconSet/Color/AdBlack.png}
  - {name: AI, <<: *pr, icon: https://testingcf.jsdelivr.net/gh/LancelotRar/policy-icon-set@main/IconSet/Color/AI.png}
  - {name: GitHub, <<: *pr, icon: https://testingcf.jsdelivr.net/gh/LancelotRar/policy-icon-set@main/IconSet/Color/GitHub.png}
  - {name: YouTube, <<: *pr, icon: https://testingcf.jsdelivr.net/gh/LancelotRar/policy-icon-set@main/IconSet/Color/YouTube.png}
  - {name: Google, <<: *pr, icon: https://testingcf.jsdelivr.net/gh/LancelotRar/policy-icon-set@main/IconSet/Color/Google_Search.png}
  - {name: Telegram, <<: *pr, icon: https://testingcf.jsdelivr.net/gh/LancelotRar/policy-icon-set@main/IconSet/Color/Telegram.png}
  - {name: X, <<: *pr, icon: https://testingcf.jsdelivr.net/gh/LancelotRar/policy-icon-set@main/IconSet/Color/X.png}
  - {name: Netflix, <<: *pr, icon: https://testingcf.jsdelivr.net/gh/LancelotRar/policy-icon-set@main/IconSet/Color/Netflix.png}
  - {name: TikTok, <<: *pr, icon: https://testingcf.jsdelivr.net/gh/LancelotRar/policy-icon-set@main/IconSet/Color/TikTok.png}
  - {name: Streaming, <<: *pr, icon: https://testingcf.jsdelivr.net/gh/LancelotRar/policy-icon-set@main/IconSet/Color/Streaming!CN.png}
  - {name: Test, <<: *pr, icon: https://testingcf.jsdelivr.net/gh/LancelotRar/policy-icon-set@main/IconSet/Color/Speedtest.png}
  - {name: 国外, <<: *pr, icon: https://testingcf.jsdelivr.net/gh/LancelotRar/policy-icon-set@main/IconSet/Color/Global.png}
  - {name: 国内, <<: *pr_gn, icon: https://testingcf.jsdelivr.net/gh/LancelotRar/policy-icon-set@main/IconSet/Color/CN.png}
  - {name: CF-手动, type: select, include-all: true, filter: "(?=.*(本地|CF)).*$", icon: https://testingcf.jsdelivr.net/gh/LancelotRar/policy-icon-set@main/IconSet/Color/Cloudflare.png}
  - {name: 其他-自动, <<: *pr_ut, filter: "^((?!(➡️ 直连|🚫 拒绝|本地|CF)).)*$", icon: https://testingcf.jsdelivr.net/gh/LancelotRar/policy-icon-set@main/IconSet/Color/LinkCube.png}
  - {name: 其他-手动, type: select, include-all: true, filter: "^((?!(➡️ 直连|🚫 拒绝|本地|CF)).)*$", icon: https://testingcf.jsdelivr.net/gh/LancelotRar/policy-icon-set@main/IconSet/Color/Clubhouse.png}

  - {name: 🇸🇬 新加坡-自动, <<: *pr_ut, filter: "(?=.*(坡|狮城|🇸🇬|(?<![A-Za-z])SG(?![A-Za-z])|Singapore|SGP)).*$"}
  - {name: 🇯🇵 日本-自动, <<: *pr_ut, filter: "(?=.*(日|🇯🇵|(?<![A-Za-z])JP(?![A-Za-z])|Japan|JPN)).*$"}
  - {name: 🇭🇰 香港-自动, <<: *pr_ut, filter: "(?=.*(港|🇭🇰|(?<![A-Za-z])HK(?![A-Za-z])|Hong|HKG)).*$"}
  - {name: 🇨🇳 台湾-自动, <<: *pr_ut, filter: "(?=.*(台|🇹🇼|(?<![A-Za-z])TW(?![A-Za-z])|tai|TPE)).*$"}
  - {name: 🇲🇾 马来西亚-自动, <<: *pr_ut, filter: "(?=.*(马来西亚|🇲🇾|(?<![A-Za-z])MY(?![A-Za-z])|Malaysia|MYS)).*$"}
  - {name: 🗺 其他国家-自动, <<: *pr_ut, filter: "^((?!(➡️ 直连|🚫 拒绝|坡|狮城|🇸🇬|(?<![A-Za-z])SG(?![A-Za-z])|Singapore|SGP|日|🇯🇵|(?<![A-Za-z])JP(?![A-Za-z])|Japan|JPN|港|🇭🇰|(?<![A-Za-z])HK(?![A-Za-z])|Hong|HKG|台|🇹🇼|(?<![A-Za-z])TW(?![A-Za-z])|tai|TPE|马来西亚|🇲🇾|(?<![A-Za-z])MY(?![A-Za-z])|Malaysia|MYS)).)*$"}

# ========================
# 规则引擎（rules）
# ========================
rules:
  - RULE-SET,AD_Domain,AD
  - RULE-SET,GitHub_Domain,GitHub
  - RULE-SET,YouTube_Domain,YouTube
  - RULE-SET,Google_Domain,Google
  - RULE-SET,Telegram_Domain,Telegram
  - RULE-SET,X_Domain,X
  - RULE-SET,Netflix_Domain,Netflix
  - RULE-SET,TikTok_Domain,TikTok
  - RULE-SET,Disney_Domain,Streaming
  - RULE-SET,PrimeVideo_Domain,Streaming
  - RULE-SET,Google_IP,Google,no-resolve
  - RULE-SET,Telegram_IP,Telegram,no-resolve
  - RULE-SET,Netflix_IP,Netflix,no-resolve
  - RULE-SET,AI_Class,AI
  - RULE-SET,Test_Class,Test
  - RULE-SET,Proxy_Class,国外
  - RULE-SET,Globe_Class,国外
  - MATCH,国内

# ========================
