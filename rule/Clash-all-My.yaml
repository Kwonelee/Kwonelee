# ========================
# Clash-ALL
# ========================
# 订阅信息
proxy-providers:

  CF优选:
    url: "XXXXXX"
    type: http
    interval: 604800
    health-check:
      enable: false
      url: https://www.gstatic.com/generate_204
      interval: 300
    proxy: ➡️ 直连

# 节点信息
proxies:
  - {name: ➡️ 直连, type: direct}
  - {name: 🚫 拒绝, type: reject}

# ========================
# 主要端口设置
# ========================
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7895

allow-lan: true
mode: rule
log-level: info

external-controller: 0.0.0.0:9090
external-ui: /usr/share/openclash/ui
external-ui-name: zashboard
external-ui-url: https://gh-proxy.com/github.com/Zephyruso/zashboard/archive/refs/heads/dist.zip
secret: "123456"

# ========================
# DNS 设置
# ========================
dns:
  enable: true
  listen: 0.0.0.0:7874
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.20.0.1/16
  nameserver:
    - 223.5.5.5
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - +.lan
    - +.local
    - geosite:cn

ipv6: true

# ========================
# TUN 模块
# ========================
tun:
  enable: true
  stack: gvisor
  device: utun
  endpoint-independent-nat: true
  auto-route: false
  auto-detect-interface: false
  auto-redirect: false
  strict-route: false

profile:
  store-selected: true
  store-fake-ip: true

# ========================
# 策略组定义
# ========================
default_jd: &default_jd {type: select, proxies: [CF-手动,其他-自动,🇸🇬 新加坡-自动,🇯🇵 日本-自动,🇭🇰 香港-自动,🇨🇳 台湾-自动,🇲🇾 马来西亚-自动,🗺 其他国家-自动,其他-手动,➡️ 直连,🚫 拒绝]}
default_ad: &default_ad {type: select, proxies: [🚫 拒绝,➡️ 直连,默认节点]}
default_gn: &default_gn {type: select, proxies: [➡️ 直连,默认节点]}
default: &default {type: select, proxies: [默认节点,CF-手动,其他-自动,🇸🇬 新加坡-自动,🇯🇵 日本-自动,🇭🇰 香港-自动,🇨🇳 台湾-自动,🇲🇾 马来西亚-自动,🗺 其他国家-自动,其他-手动,➡️ 直连,🚫 拒绝]}

proxy-groups:
  - {name: 默认节点, <<: *default_jd, icon: https://testingcf.jsdelivr.net/gh/LancelotRar/policy-icon-set@main/IconSet/Color/Rocket.png}
  - {name: AD, <<: *default_ad, icon: https://testingcf.jsdelivr.net/gh/LancelotRar/policy-icon-set@main/IconSet/Color/AdBlack.png}
  - {name: AI, <<: *default, icon: https://testingcf.jsdelivr.net/gh/LancelotRar/policy-icon-set@main/IconSet/Color/AI.png}
  - {name: GitHub, <<: *default, icon: https://testingcf.jsdelivr.net/gh/LancelotRar/policy-icon-set@main/IconSet/Color/GitHub.png}
  - {name: YouTube, <<: *default, icon: https://testingcf.jsdelivr.net/gh/LancelotRar/policy-icon-set@main/IconSet/Color/YouTube.png}
  - {name: Google, <<: *default, icon: https://testingcf.jsdelivr.net/gh/LancelotRar/policy-icon-set@main/IconSet/Color/Google_Search.png}
  - {name: Telegram, <<: *default, icon: https://testingcf.jsdelivr.net/gh/LancelotRar/policy-icon-set@main/IconSet/Color/Telegram.png}
  - {name: X, <<: *default, icon: https://testingcf.jsdelivr.net/gh/LancelotRar/policy-icon-set@main/IconSet/Color/X.png}
  - {name: Netflix, <<: *default, icon: https://testingcf.jsdelivr.net/gh/LancelotRar/policy-icon-set@main/IconSet/Color/Netflix.png}
  - {name: TikTok, <<: *default, icon: https://testingcf.jsdelivr.net/gh/LancelotRar/policy-icon-set@main/IconSet/Color/TikTok.png}
  - {name: Streaming, <<: *default, icon: https://testingcf.jsdelivr.net/gh/LancelotRar/policy-icon-set@main/IconSet/Color/Streaming!CN.png}
  - {name: Test, <<: *default, icon: https://testingcf.jsdelivr.net/gh/LancelotRar/policy-icon-set@main/IconSet/Color/Speedtest.png}
  - {name: 国外, <<: *default, icon: https://testingcf.jsdelivr.net/gh/LancelotRar/policy-icon-set@main/IconSet/Color/Global.png}
  - {name: 国内, <<: *default_gn, icon: https://testingcf.jsdelivr.net/gh/LancelotRar/policy-icon-set@main/IconSet/Color/CN.png}
  - {name: CF-手动, type: select, include-all: true, filter: "(?=.*(优选|CF|snippets|online)).*$", icon: https://testingcf.jsdelivr.net/gh/LancelotRar/policy-icon-set@main/IconSet/Color/Cloudflare.png}
  - {name: 其他-自动, type: url-test, include-all: true, tolerance: 50, interval: 300, lazy: true, filter: "^((?!(➡️ 直连|🚫 拒绝|优选|CF|snippets|online)).)*$", icon: https://testingcf.jsdelivr.net/gh/LancelotRar/policy-icon-set@main/IconSet/Color/LinkCube.png}
  - {name: 其他-手动, type: select, include-all: true, filter: "^((?!(➡️ 直连|🚫 拒绝|优选|CF|snippets|online)).)*$", icon: https://testingcf.jsdelivr.net/gh/LancelotRar/policy-icon-set@main/IconSet/Color/Clubhouse.png}
  - {name: 🇸🇬 新加坡-自动, type: url-test, include-all: true, tolerance: 50, interval: 300, lazy: true, filter: "(?=.*(坡|狮城|🇸🇬|(?<![A-Za-z])SG(?![A-Za-z])|Singapore|SGP)).*$"}
  - {name: 🇯🇵 日本-自动, type: url-test, include-all: true, tolerance: 50, interval: 300, lazy: true, filter: "(?=.*(日|🇯🇵|(?<![A-Za-z])JP(?![A-Za-z])|Japan|JPN)).*$"}
  - {name: 🇭🇰 香港-自动, type: url-test, include-all: true, tolerance: 50, interval: 300, lazy: true, filter: "(?=.*(港|🇭🇰|(?<![A-Za-z])HK(?![A-Za-z])|Hong|HKG)).*$"}
  - {name: 🇨🇳 台湾-自动, type: url-test, include-all: true, tolerance: 50, interval: 300, lazy: true, filter: "(?=.*(台|🇹🇼|(?<![A-Za-z])TW(?![A-Za-z])|tai|TPE)).*$"}
  - {name: 🇲🇾 马来西亚-自动, type: url-test, include-all: true, tolerance: 50, interval: 300, lazy: true, filter: "(?=.*(马来西亚|🇲🇾|(?<![A-Za-z])MY(?![A-Za-z])|Malaysia|MYS)).*$"}
  - {name: 🗺 其他国家-自动, type: url-test, include-all: true, tolerance: 50, interval: 300, lazy: true, filter: "^((?!(➡️ 直连|🚫 拒绝|坡|狮城|🇸🇬|(?<![A-Za-z])SG(?![A-Za-z])|Singapore|SGP|日|🇯🇵|(?<![A-Za-z])JP(?![A-Za-z])|Japan|JPN|港|🇭🇰|(?<![A-Za-z])HK(?![A-Za-z])|Hong|HKG|台|🇹🇼|(?<![A-Za-z])TW(?![A-Za-z])|tai|TPE|马来西亚|🇲🇾|(?<![A-Za-z])MY(?![A-Za-z])|Malaysia|MYS)).)*$"}

# ========================
# 规则引擎（rules）
# ========================
rules:
  - RULE-SET,AD / Domain,AD
  - RULE-SET,GitHub / Domain,GitHub
  - RULE-SET,Youtube / Domain,YouTube
  - RULE-SET,Google / Domain,Google
  - RULE-SET,Telegram / Domain,Telegram
  - RULE-SET,X / Domain,X
  - RULE-SET,Netflix / Domain,Netflix
  - RULE-SET,TikTok / Domain,TikTok
  - RULE-SET,Disney / Domain,Streaming
  - RULE-SET,PrimeVideo / Domain,Streaming
  - RULE-SET,Google / IP,Google,no-resolve
  - RULE-SET,Telegram / IP,Telegram,no-resolve
  - RULE-SET,Netflix / IP,Netflix,no-resolve
  - RULE-SET,AI / Domain,AI
  - RULE-SET,TEST / Domain,Test
  - RULE-SET,Proxy / Domain,国外
  - RULE-SET,Globe / Domain,国外
  - MATCH,国内

# ========================
# 规则集提供者
# ========================
rule-anchor:
  ip: &ip {type: http, interval: 86400, behavior: ipcidr, format: mrs}
  domain: &domain {type: http, interval: 86400, behavior: domain, format: mrs}
  class: &class {type: http, interval: 86400, behavior: classical, format: text}

rule-providers:
  AD / Domain: {<<: *domain, url: "https://gh-proxy.com/github.com/metacubex/meta-rules-dat/raw/refs/heads/meta/geo/geosite/category-ads-all.mrs"}
